services:
  call:
    build: .
    network_mode: host
    env_file: .env
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.9.0
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.generated.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
  caddy:
    image: caddy:2
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
